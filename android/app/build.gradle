plugins {
    id 'com.android.application'
}

import java.util.Properties

def flowAppUrl = (project.findProperty("FLOW_APP_URL") ?: "https://flow-blush-nu.vercel.app").toString()
def signingPropsFile = rootProject.file(".signing/keystore.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'app.flow.money'
    compileSdk 36

    defaultConfig {
        applicationId 'app.flow.money'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '1.3.0'
        buildConfigField 'String', 'APP_URL', '"' + flowAppUrl.replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (signingPropsFile.exists()) {
            release {
                storeFile rootProject.file(".signing/${signingProps['storeFile']}")
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
