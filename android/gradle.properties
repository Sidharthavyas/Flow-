# Lightweight Gradle settings for an 8 GB RAM laptop.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=false
android.nonTransitiveRClass=true

# Change this only if you move Flow to another domain.
FLOW_APP_URL=https://flow-blush-nu.vercel.app
